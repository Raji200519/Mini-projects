<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>🐤 Flappy Bird Adventure</h1>
        <p class="subtitle">Fly high and avoid the pipes!</p>

        <div class="score-board">
            Score: <span id="score">0</span>
            <span class="best-score">Best: <span id="best">0</span></span>
        </div>

        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <p id="message">Press START to play!</p>

        <button id="startButton">START GAME</button>

        <p class="instructions">
            Press SPACE, click, or tap to fly!
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
